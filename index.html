<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#324066;
    --marigold:#F4A93C;
    --marigold-deep:#E08A1B;
    --paper:#FBF3E1;
    --paper-deep:#F3E7CB;
    --peacock:#0E6E5A;
    --peacock-deep:#0A5346;
    --maroon:#8C2F39;
    --maroon-deep:#712330;
    --text:#2B2620;
    --text-soft:#5B5346;
    --err:#C1443B;
    --line:#E4D6B4;
    --white:#FFFDF8;
    --radius:16px;
    --shadow: 0 8px 24px rgba(27,42,74,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline:3px solid #0E6E5A; outline-offset:2px;
  }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  body{
    font-family:'Karla',sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(244,169,60,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(14,110,90,0.08), transparent 40%),
      #E9E1CC;
    background-image:
      radial-gradient(circle, rgba(27,42,74,0.05) 1px, transparent 1px),
      radial-gradient(circle at 20% 10%, rgba(244,169,60,0.10), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(14,110,90,0.10), transparent 40%);
    background-size: 18px 18px, auto, auto;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px 10px;
  }
  h1,h2,h3,h4{font-family:'Fraunces',serif; margin:0; color:var(--ink); letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:'Karla',sans-serif; cursor:pointer;}
  ::selection{background:var(--marigold); color:var(--ink);}

  /* ---------- Phone frame ---------- */
  #frame{
    width:430px;
    max-width:100%;
    height:900px;
    max-height:94vh;
    background:var(--paper);
    border-radius:34px;
    box-shadow: 0 30px 60px rgba(27,42,74,0.35), 0 0 0 10px #14203a, 0 0 0 11px #3a4a72;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #screenArea{
    flex:1;
    overflow-y:auto;
    position:relative;
    scrollbar-width:thin;
  }
  #screenArea::-webkit-scrollbar{width:6px;}
  #screenArea::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .page{ padding:22px 20px 100px 20px; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .page{animation:none;} }

  /* ---------- Logo ---------- */
  .logo-badge{ display:inline-flex; align-items:center; justify-content:center; }
  .wordmark{ font-family:'Fraunces',serif; font-weight:600; }
  .wordmark .suman{ color:var(--ink); }
  .wordmark .gyan{ color:var(--marigold-deep); }

  /* ---------- Splash ---------- */
  #splash{
    position:absolute; inset:0; background:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    z-index:50;
  }
  #splash .tag{ color:#D9C9A0; font-size:14px; letter-spacing:0.02em; }
  #splash .wordmark{ font-size:30px; }
  #splash .wordmark .suman{ color:var(--white); }

  /* ---------- Buttons & inputs ---------- */
  .btn{
    border:none; border-radius:12px; padding:13px 18px; font-weight:700; font-size:15px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--marigold); color:var(--ink); box-shadow:0 4px 0 var(--marigold-deep); }
  .btn-primary:active{ box-shadow:0 1px 0 var(--marigold-deep); transform:translateY(3px) scale(0.99); }
  .btn-outline{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
  .btn-peacock{ background:var(--peacock); color:var(--white); box-shadow:0 4px 0 var(--peacock-deep); }
  .btn-peacock:active{ box-shadow:0 1px 0 var(--peacock-deep); transform:translateY(3px) scale(0.99); }
  .btn-block{ width:100%; display:block; text-align:center; }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:9px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--white); font-family:'Karla',sans-serif; font-size:14.5px; color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--peacock);
  }
  .error-msg{ color:var(--err); font-size:12.5px; margin-top:8px; font-weight:600; }
  .hint{ color:var(--text-soft); font-size:12.5px; }

  /* ---------- Auth ---------- */
  #authScreen{ padding:34px 26px; min-height:100%; }
  .auth-toggle{ display:flex; background:var(--paper-deep); border-radius:12px; padding:4px; margin:22px 0 20px 0; }
  .auth-toggle button{ flex:1; padding:10px; border:none; background:transparent; border-radius:9px; font-weight:700; color:var(--text-soft); }
  .auth-toggle button.active{ background:var(--ink); color:var(--white); }

  /* ---------- Header (in app) ---------- */
  #appHeader{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--ink); color:var(--white);
    position:sticky; top:0; z-index:10;
  }
  .grade-pill{ background:rgba(255,255,255,0.15); padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .offline-banner{
    background:var(--maroon); color:var(--white); font-size:12.5px; font-weight:600;
    padding:9px 18px; display:flex; align-items:center; gap:8px;
  }
  .offline-dot{width:7px; height:7px; border-radius:50%; background:#ffb4a8; flex:none;}

  /* ---------- Bottom nav ---------- */
  #bottomNav{
    display:flex; background:var(--white); border-top:1.5px solid var(--line);
    padding:8px 4px calc(env(safe-area-inset-bottom, 8px)); position:relative; z-index:20;
  }
  .nav-btn{
    flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 2px; color:var(--text-soft); font-size:10.5px; font-weight:700; border-radius:10px;
  }
  .nav-btn.active{ color:var(--peacock-deep); }
  .nav-btn svg{ width:20px; height:20px; }

  /* ---------- Cards / common ---------- */
  .section-title{ font-size:21px; margin-bottom:4px; }
  .section-sub{ color:var(--text-soft); font-size:13.5px; margin-bottom:18px; }
  .card{
    background:var(--white); border-radius:var(--radius); padding:16px; margin-bottom:14px;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .subject-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .subject-card{
    border-radius:16px; padding:16px 14px; color:var(--white); position:relative; overflow:hidden;
    min-height:104px; display:flex; flex-direction:column; justify-content:space-between; border:none; text-align:left;
  }
  .subject-card .icon{ width:26px; height:26px; }
  .subject-card .name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; }
  .chip{ display:inline-block; padding:5px 11px; border-radius:20px; font-size:12px; font-weight:700; background:var(--paper-deep); color:var(--ink-soft); margin:0 6px 8px 0; border:none;}
  .chip.active{ background:var(--ink); color:var(--white); }
  .progress-track{ height:7px; background:var(--paper-deep); border-radius:4px; overflow:hidden; margin-top:8px;}
  .progress-fill{ height:100%; background:var(--peacock); border-radius:4px; }

  /* ---------- Timeline (history) ---------- */
  .timeline{ position:relative; margin-left:10px; padding-left:22px; border-left:2.5px solid var(--paper-deep); }
  .tl-item{ position:relative; margin-bottom:6px; }
  .tl-item::before{
    content:''; position:absolute; left:-28.5px; top:4px; width:12px; height:12px; border-radius:50%;
    background:var(--maroon); border:3px solid var(--paper);
  }
  .tl-date{ font-weight:800; color:var(--maroon); font-size:13px; }
  .tl-title{ font-family:'Fraunces',serif; font-size:16.5px; margin:2px 0 6px 0; }
  .tl-body{ font-size:13.5px; line-height:1.55; color:var(--text-soft); display:none; }
  .tl-item.open .tl-body{ display:block; }
  .tl-toggle{ background:none; border:none; color:var(--peacock-deep); font-weight:700; font-size:12.5px; padding:0; margin-bottom:16px; }

  /* ---------- Geography map ---------- */
  .map-wrap{
    background:linear-gradient(180deg,#0B2540 0%, #123A5C 55%, #0E6E5A 100%);
    border-radius:16px; padding:14px; position:relative; overflow:hidden;
  }
  .map-wrap svg{ width:100%; height:auto; display:block; }
  .map-region{ cursor:pointer; transition:filter .15s ease, opacity .15s ease; }
  .map-region:hover, .map-region.selected{ filter:brightness(1.35) drop-shadow(0 0 6px rgba(244,169,60,0.9)); }
  .map-label{ font-family:'Karla',sans-serif; font-size:9px; fill:#F3E7CB; font-weight:700; pointer-events:none; }
  .map-star{ pointer-events:none; }
  .fact-pop{
    background:var(--white); border-radius:12px; padding:14px; margin-top:12px; border:1px solid var(--line);
    display:none;
  }
  .fact-pop.show{ display:block; animation:fadeIn .25s ease; }

  /* ---------- Chat / tutor ---------- */
  .chat-scroll{ display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .msg{ padding:11px 14px; border-radius:14px; font-size:13.8px; line-height:1.5; max-width:85%; white-space:pre-wrap; }
  .msg.user{ background:var(--ink); color:var(--white); align-self:flex-end; border-bottom-right-radius:3px; }
  .msg.bot{ background:var(--white); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:3px; }
  .chat-input-row{ display:flex; gap:8px; position:sticky; bottom:0; background:var(--paper); padding-top:6px; }
  .chat-input-row input{ flex:1; }
  .typing{ display:flex; gap:4px; padding:6px 2px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--text-soft); animation:bounce 1s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; } .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-5px);} }

  /* ---------- Calculator ---------- */
  .calc-display{ background:var(--ink); color:var(--white); border-radius:12px; padding:16px; font-family:'Fraunces',serif; font-size:22px; margin-bottom:12px; min-height:28px; word-break:break-all;}
  .steps-list{ counter-reset:step; list-style:none; padding:0; margin:0; }
  .steps-list li{ counter-increment:step; padding:10px 0 10px 34px; position:relative; border-bottom:1px dashed var(--line); font-size:13.8px; line-height:1.5;}
  .steps-list li:last-child{ border-bottom:none; }
  .steps-list li::before{
    content:counter(step); position:absolute; left:0; top:9px; width:22px; height:22px; border-radius:50%;
    background:var(--marigold); color:var(--ink); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Solver upload ---------- */
  .upload-box{
    border:2px dashed var(--line); border-radius:16px; padding:26px 14px; text-align:center; background:var(--white);
  }
  .preview-img{ max-width:100%; border-radius:12px; margin-top:12px; border:1px solid var(--line); }

  .banner-info{ background:#EAF4F1; border:1px solid #BFE0D6; color:var(--peacock-deep); font-size:12.5px; font-weight:600; padding:10px 12px; border-radius:10px; margin-bottom:14px;}
  .banner-warn{ background:#FBE9E5; border:1px solid #F0BEB3; color:var(--maroon-deep); font-size:12.5px; font-weight:600; padding:10px 12px; border-radius:10px; margin-bottom:14px;}

  .empty-note{ text-align:center; color:var(--text-soft); font-size:13px; padding:30px 10px; }
  .link-btn{ background:none; border:none; color:var(--peacock-deep); font-weight:700; font-size:13px; padding:0; }
  .row{ display:flex; align-items:center; justify-content:space-between; }
  .small{ font-size:12px; }
  .mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mb0{margin-bottom:0;}
</style>
</head>

   API helper
   ========================================================= */
async function callClaude(messages, opts={}){
  const body = { model: 'claude-sonnet-4-6', max_tokens: 1000, messages };
  if(opts.system) body.system = opts.system;
  if(opts.tools) body.tools = opts.tools;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error('Tutor engine did not respond (status ' + res.status + ')');
  const data = await res.json();
  return (data.content || []).map(b => b.type === 'text' ? b.text : '').join('\n').trim();
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('Could not read the image'));
    r.readAsDataURL(file);
  });
}

    <g class="map-region ${sel==='Himalayas'?'selected':''}" data-region="Himalayas"><path d="M70 20 L150 18 L145 32 L75 34 Z" fill="#EAF3F5"/><text x="72" y="16" class="map-label">HIMALAYAS</text></g>
    <g class="map-region ${sel==='Thar Desert'?'selected':''}" data-region="Thar Desert"><ellipse cx="75" cy="65" rx="16" ry="12" fill="#E3C77E"/><text x="55" y="60" class="map-label">THAR</text></g>
    <g class="map-region ${sel==='Ganga Basin'?'selected':''}" data-region="Ganga Basin"><path d="M90 45 Q125 60 160 90" fill="none" stroke="#5AA9D6" stroke-width="4"/><text x="115" y="52" class="map-label">GANGA</text></g>
    <g class="map-region ${sel==='Deccan Plateau'?'selected':''}" data-region="Deccan Plateau"><ellipse cx="105" cy="150" rx="28" ry="30" fill="#B77B4A"/><text x="82" y="150" class="map-label">DECCAN</text></g>
    <g class="map-region ${sel==='Western Ghats'?'selected':''}" data-region="Western Ghats"><path d="M75 120 L65 200" fill="none" stroke="#3C7A46" stroke-width="5"/><text x="35" y="165" class="map-label">W.GHATS</text></g>
  </svg>`;

  const svg = tab==='world' ? worldSvg : tab==='india' ? indiaSvg : physicalSvg;

  return `
  <div class="page">
    <h2 class="section-title">Geography</h2>
    <p class="section-sub">Tap a region on the map to reveal a fact.</p>
    <div>
      <button class="chip geo-tab ${tab==='world'?'active':''}" data-geo="world">World</button>
      <button class="chip geo-tab ${tab==='india'?'active':''}" data-geo="india">India</button>
      <button class="chip geo-tab ${tab==='physical'?'active':''}" data-geo="physical">Physical Features</button>
    </div>
    <div class="map-wrap mt12">${svg}</div>
    <p class="hint mt8">Maps are simplified for study and not to exact scale.</p>
    <div class="fact-pop ${sel && facts[sel] ? 'show':''}" id="geoFact">
      ${sel && facts[sel] ? `<h4 style="font-size:15px;">${sel}</h4><p class="hint mt8" style="font-size:13.5px; color:var(--text);">${facts[sel]}</p>` : ''}
    </div>
  </div>`;
}

/* ---------- History ---------- */
function renderHistory(){
  const era = state.historyEra || 'Ancient India';
  const items = HISTORY_ERAS[era];
  const openSet = state.historyOpen || {};
  return `
  <div class="page">
    <h2 class="section-title">History</h2>
    <p class="section-sub">Specific dates, short stories — pick an era below.</p>
    <div>${Object.keys(HISTORY_ERAS).map(e=>`<button class="chip era-tab ${era===e?'active':''}" data-era="${e}">${e}</button>`).join('')}</div>
    <div class="timeline mt16">
      ${items.map((it,i)=>{
        const key = era+i;
        const open = openSet[key];
        return `
        <div class="tl-item ${open?'open':''}">
          <div class="tl-date">${it.date}</div>
          <div class="tl-title">${it.title}</div>
          <button class="tl-toggle" data-histkey="${key}">${open?'Hide story':'Read the story'}</button>
          <div class="tl-body">${it.body}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---------- Mathematics ---------- */
function renderMath(){
  const band = state.mathBand || 'Secondary (9–10)';
  const pIndex = state.practiceOpen || {};
  return `
  <div class="page">
    <h2 class="section-title">Mathematics</h2>
    <p class="section-sub">Pick a topic, or try the step-by-step calculator.</p>

    <div class="card">
      <h3 style="font-size:15.5px; margin-bottom:10px;">Advanced calculator</h3>
      <input id="calcInput" type="text" placeholder="e.g. 2x + 5 = 17, or 3/4 + 1/2" value="${state.calcExpr}" style="width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--line); font-size:14.5px; margin-bottom:10px;">
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline btn-sm" id="calcQuick">Quick answer</button>
        <button class="btn btn-primary btn-sm" id="calcSteps" ${state.offline?'disabled':''}>Show steps ${state.offline?'(needs internet)':''}</button>
      </div>
      ${state.calcResult!==null ? `<div class="calc-display mt12">${state.calcResult}</div>` : ''}
      ${state.calcLoading ? `<div class="typing mt12"><span></span><span></span><span></span></div>` : ''}
      ${state.calcError ? `<p class="error-msg">${state.calcError}</p>` : ''}
      ${state.calcSteps ? `<ol class="steps-list mt12">${state.calcSteps.map(s=>`<li>${s}</li>`).join('')}</ol>` : ''}
    </div>

    <h3 style="font-size:15px; margin:18px 0 10px;">Topics by class</h3>
    <div>${Object.keys(MATH_TOPICS).map(b=>`<button class="chip band-tab ${band===b?'active':''}" data-band="${b}">${b}</button>`).join('')}</div>
    <div class="card mt12">
      ${MATH_TOPICS[band].map(t=>`<div style="padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px;">${t}</div>`).join('')}
    </div>

    <h3 style="font-size:15px; margin:18px 0 10px;">Offline practice problems</h3>
    ${PRACTICE_PROBLEMS.map((p,i)=>`
      <div class="card">
        <div class="row"><strong style="font-size:14px;">${p.q}</strong></div>
        <button class="link-btn mt8" data-practice="${i}">${pIndex[i] ? 'Hide solution' : 'Show solution'}</button>
        ${pIndex[i] ? `<ol class="steps-list mt12">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>` : ''}
      </div>`).join('')}
  </div>`;
}

/* ---------- GK ---------- */
function renderGK(){
  const cat = state.gkCategory;
  const list = cat==='All' ? GK_DATA : GK_DATA.filter(g=>g.cat===cat);
  const cats = ['All','India','World','Science','Sports'];
  return `
  <div class="page">
    <h2 class="section-title">General Knowledge</h2>
    <p class="section-sub">Evergreen facts, plus a live refresh for what's current.</p>
    <div>${cats.map(c=>`<button class="chip gk-cat ${cat===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>

    ${state.offline ? `<div class="banner-warn mt12">Offline mode: showing saved facts only.</div>` :
      `<button class="btn btn-peacock btn-block mt12" id="gkRefresh" ${state.gkLoading?'disabled':''}>${state.gkLoading?'Fetching latest facts…':'Get fresh current-affairs GK'}</button>`}
    ${state.gkError ? `<p class="error-msg">${state.gkError}</p>` : ''}
    ${state.gkExtra ? `<div class="card mt12"><h4 style="font-size:14.5px;">Fresh from today</h4><p class="hint mt8" style="color:var(--text); font-size:13.5px; white-space:pre-wrap;">${state.gkExtra}</p></div>` : ''}

    <div class="mt16">
      ${list.map(g=>`
        <div class="card">
          <span class="chip" style="margin-bottom:8px;">${g.cat}</span>
          <div style="font-weight:700; font-size:14px; margin-bottom:6px;">${g.q}</div>
          <div style="font-size:13.5px; color:var(--text-soft);">${g.a}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- Visual Solver ---------- */
function renderSolver(){
  return `
  <div class="page">
    <h2 class="section-title">Visual Question Solver</h2>
    <p class="section-sub">Snap or upload a question — get a step-by-step explanation.</p>
    ${state.offline ? `<div class="banner-warn">This feature needs internet — switch off offline mode from Home.</div>` : `<div class="banner-info">Works for maths, science, geography or any school question in a photo. AI answers can be wrong sometimes — check important ones with a teacher.</div>`}

    <div class="upload-box mt12">
      <input type="file" id="solverFile" accept="image/*" style="display:none;">
      <button class="btn btn-outline" id="solverPick">Choose an image</button>
      ${state.solverImage ? `<img class="preview-img" src="${state.solverImage}">` : `<p class="hint mt8">PNG or JPG of a textbook question</p>`}
    </div>
    <div class="field mt12"><label>Anything to add? (optional)</label><input id="solverContext" type="text" placeholder="e.g. this is a Class 9 physics question" value="${state.solverContext}"></div>
    <button class="btn btn-primary btn-block" id="solverSubmit" ${state.offline || !state.solverImage || state.solverLoading ? 'disabled':''}>${state.solverLoading?'Reading and solving…':'Solve this question'}</button>
    ${state.solverError ? `<p class="error-msg">${state.solverError}</p>` : ''}
    ${state.solverLoading ? `<div class="typing mt12"><span></span><span></span><span></span></div>` : ''}
    ${state.solverAnswer ? `<div class="card mt16"><h4 style="font-size:15px;">Explanation</h4><p class="mt8" style="font-size:13.8px; line-height:1.55; white-space:pre-wrap;">${state.solverAnswer}</p></div>` : ''}
  </div>`;
}

/* ---------- Tutor chat ---------- */
function renderTutor(){
  return `
  <div class="page" style="display:flex; flex-direction:column; min-height:calc(100% - 22px);">
    <h2 class="section-title">Ask a Tutor</h2>
    <p class="section-sub">Explains any subject, simply — ${GRADE_LABELS[state.user.grade]} level.</p>
    <p class="hint" style="margin-bottom:10px;">AI-generated answers can be wrong sometimes — check important ones with a teacher.</p>
    ${state.offline ? `<div class="banner-warn">Offline mode is on — the live tutor needs internet.</div>` : ''}
    <div class="chat-scroll" id="chatScroll" role="log" aria-live="polite">
      ${state.tutorMessages.length===0 ? `<div class="empty-note">Ask anything — "Why is the sky blue?" or "Explain photosynthesis simply."</div>` : ''}
      ${state.tutorMessages.map((m,i)=>`<div class="msg ${m.role==='user'?'user':'bot'}">${m.text}${m.role!=='user'?`<div><button class="link-btn" style="font-size:11px; margin-top:6px;" data-report-msg="${i}">Report this answer</button></div>`:''}</div>`).join('')}
      ${state.tutorLoading ? `<div class="msg bot"><div class="typing"><span></span><span></span><span></span></div></div>` : ''}
    </div>
    <div class="chat-input-row">
      <input id="tutorInput" type="text" placeholder="${state.offline?'Needs internet…':'Type your question…'}" ${state.offline?'disabled':''}>
      <button class="btn btn-primary btn-sm" id="tutorSend" ${state.offline?'disabled':''}>Send</button>
    </div>
  </div>`;
}

/* =========================================================
   Event binding
   ========================================================= */
function bindEvents(){
  document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{ state.authMode=b.dataset.auth; state.authError=''; render(); });

  const guestBtn = document.getElementById('guestBtn');
  if(guestBtn) guestBtn.onclick = () => {
    state.user = { name:'Guest Student', email:'guest@sumangyan.app', grade:'6' };
    state.screen='app'; state.activeTab='home'; render();
  };

  const demoFillBtn = document.getElementById('demoFillBtn');
  if(demoFillBtn) demoFillBtn.onclick = () => {
    document.getElementById('loginEmail').value = 'demo@sumangyan.app';
    document.getElementById('loginPassword').value = 'demo1234';
  };

  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.onclick = () => {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pw = document.getElementById('loginPassword').value;
    const u = state.users[email];
    if(!u || u.password !== pw){ state.authError = 'Email or password is incorrect.'; render(); return; }
    state.user = u; state.authError=''; state.screen='app'; state.activeTab='home'; render();
  };

  const suGradeSelect = document.getElementById('suGrade');
  if(suGradeSelect) suGradeSelect.onchange = (e) => { state.suGradeDraft = e.target.value; render(); };

  document.querySelectorAll('[data-legal-inline]').forEach(b=>b.onclick=()=>{
    const item = LEGAL_TEXT[b.dataset.legalInline];
    document.getElementById('legalModalBody').innerHTML = `<h3 style="font-size:16px; margin-bottom:12px;">${item.title}</h3><p style="font-size:13.2px; line-height:1.6; white-space:pre-line; color:var(--text-soft);">${item.body}</p>`;
    document.getElementById('legalModal').style.display = 'flex';
  });

  const signupBtn = document.getElementById('signupBtn');
  if(signupBtn) signupBtn.onclick = () => {
    const name = document.getElementById('suName').value.trim();
    const email = document.getElementById('suEmail').value.trim().toLowerCase();
    const grade = document.getElementById('suGrade').value;
    const pw = document.getElementById('suPassword').value;
    const cpw = document.getElementById('suConfirm').value;
    const consent = document.getElementById('suConsent').checked;
    const isChild = CHILD_GRADES.includes(grade);
    const guardianEmailEl = document.getElementById('suGuardianEmail');
    const guardianEmail = guardianEmailEl ? guardianEmailEl.value.trim().toLowerCase() : '';
    if(!name || !email){ state.authError='Please fill in your name and email.'; render(); return; }
    if(!email.includes('@')){ state.authError='Enter a valid email address.'; render(); return; }
    if(state.users[email]){ state.authError='An account with this email already exists.'; render(); return; }
    if(isChild && !guardianEmail.includes('@')){ state.authError='A parent or guardian email is required for this class level.'; render(); return; }
    if(pw.length < 6){ state.authError='Password must be at least 6 characters.'; render(); return; }
    if(pw !== cpw){ state.authError='Passwords do not match.'; render(); return; }
    if(!consent){ state.authError='Please accept the Terms of Service and Privacy Policy to continue.'; render(); return; }
    const u = { name, email, password: pw, grade, guardianEmail: isChild ? guardianEmail : null };
    state.users[email] = u; state.user = u; state.authError='';
    state.screen='app'; state.activeTab='home'; render();
  };

  const settingsBtn = document.getElementById('settingsBtn');
  if(settingsBtn) settingsBtn.onclick = () => { state.activeTab='settings'; render(); };

  document.querySelectorAll('[data-legal]').forEach(b=>b.onclick=()=>{
    const item = LEGAL_TEXT[b.dataset.legal];
    document.getElementById('legalModalBody').innerHTML = `<h3 style="font-size:16px; margin-bottom:12px;">${item.title}</h3><p style="font-size:13.2px; line-height:1.6; white-space:pre-line; color:var(--text-soft);">${item.body}</p>`;
    document.getElementById('legalModal').style.display = 'flex';
  });
  const legalCloseBtn = document.getElementById('legalCloseBtn');
  if(legalCloseBtn) legalCloseBtn.onclick = () => { document.getElementById('legalModal').style.display='none'; };

  const deleteAccountBtn = document.getElementById('deleteAccountBtn');
  if(deleteAccountBtn) deleteAccountBtn.onclick = () => {
    if(!confirm('This will permanently delete your account and progress. Continue?')) return;
    delete state.users[state.user.email];
    state.user = null; state.tutorMessages=[]; state.screen='auth'; state.authMode='login'; render();
  };

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = () => { state.user=null; state.screen='auth'; state.authMode='login'; render(); };

  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.activeTab=b.dataset.tab; render(); });

  const offlineToggle = document.getElementById('offlineToggle');
  if(offlineToggle) offlineToggle.onchange = (e) => { state.offline = e.target.checked; render(); };

  document.querySelectorAll('.geo-tab').forEach(b=>b.onclick=()=>{ state.geoTab=b.dataset.geo; state.mapSelection.geo=null; render(); });
  document.querySelectorAll('.map-region').forEach(el=>el.onclick=()=>{
    const r = el.dataset.region;
    if(r === '__india_outline') return;
    state.mapSelection.geo = state.mapSelection.geo === r ? null : r;
    render();
  });

  document.querySelectorAll('.era-tab').forEach(b=>b.onclick=()=>{ state.historyEra=b.dataset.era; render(); });
  document.querySelectorAll('[data-histkey]').forEach(b=>b.onclick=()=>{
    state.historyOpen = state.historyOpen || {};
    const k = b.dataset.histkey;
    state.historyOpen[k] = !state.historyOpen[k];
    render();
  });

  document.querySelectorAll('.band-tab').forEach(b=>b.onclick=()=>{ state.mathBand=b.dataset.band; render(); });
  document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{
    state.practiceOpen = state.practiceOpen || {};
    const i = b.dataset.practice;
    state.practiceOpen[i] = !state.practiceOpen[i];
    render();
  });

  const calcInput = document.getElementById('calcInput');
  if(calcInput) calcInput.oninput = (e)=>{ state.calcExpr = e.target.value; };

  const calcQuick = document.getElementById('calcQuick');
  if(calcQuick) calcQuick.onclick = () => {
    state.calcError=''; state.calcSteps=null;
    try{
      const expr = state.calcExpr.replace(/x/g,'').trim();
      if(!expr){ state.calcResult = null; render(); return; }
      state.calcResult = math.evaluate(expr).toString();
    }catch(err){ state.calcError = 'Could not evaluate that as a plain expression — try "Show steps" for equations with x.'; state.calcResult=null; }
    render();
  };

  const calcStepsBtn = document.getElementById('calcSteps');
  if(calcStepsBtn) calcStepsBtn.onclick = async () => {
    if(!state.calcExpr.trim()) return;
    state.calcLoading = true; state.calcError=''; state.calcSteps=null; render();
    try{
      const text = await callClaude(
        [{ role:'user', content: `Solve this step by step for a school student (${GRADE_LABELS[state.user.grade]}): ${state.calcExpr}\n\nReturn ONLY a numbered list of short steps, one per line, no preamble, no markdown symbols.` }],
        { system: 'You are a patient maths tutor for Indian school students. Be concise, correct, and use simple language.' }
      );
      const steps = text.split('\n').map(l=>l.replace(/^\s*\d+[\.\)]\s*/, '').trim()).filter(Boolean);
      state.calcSteps = steps.length ? steps : [text];
    }catch(err){ state.calcError = 'Could not reach the tutor engine. Please check your connection and try again.'; }
    state.calcLoading = false; render();
  };

  const gkRefresh = document.getElementById('gkRefresh');
  if(gkRefresh) gkRefresh.onclick = async () => {
    state.gkLoading = true; state.gkError=''; render();
    try{
      const text = await callClaude(
        [{ role:'user', content: 'Give 5 recent, verified, evergreen-safe general knowledge / current affairs facts suitable for Indian school students. Keep each to one short sentence, numbered 1-5, no preamble.' }],
        { system: 'You are a GK editor for a school app. Be accurate and concise. If you are not fully certain of a very recent fact, prefer a slightly older but verified one.', tools: [{ type:'web_search_20250305', name:'web_search' }] }
      );
      state.gkExtra = text || 'No fresh facts returned — please try again.';
    }catch(err){ state.gkError = 'Could not fetch live facts. Please check your connection.'; }
    state.gkLoading = false; render();
  };
  document.querySelectorAll('.gk-cat').forEach(b=>b.onclick=()=>{ state.gkCategory=b.dataset.cat; render(); });

  const solverPick = document.getElementById('solverPick');
  const solverFile = document.getElementById('solverFile');
  if(solverPick) solverPick.onclick = () => solverFile.click();
  if(solverFile) solverFile.onchange = (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => { state.solverImage = reader.result; state.solverAnswer=null; state.solverError=''; render(); };
    reader.readAsDataURL(f);
  };
  const solverContext = document.getElementById('solverContext');
  if(solverContext) solverContext.oninput = (e)=>{ state.solverContext = e.target.value; };
  const solverSubmit = document.getElementById('solverSubmit');
  if(solverSubmit) solverSubmit.onclick = async () => {
    if(!state.solverImage) return;
    state.solverLoading = true; state.solverError=''; state.solverAnswer=null; render();
    try{
      const mediaType = state.solverImage.substring(5, state.solverImage.indexOf(';'));
      const base64 = state.solverImage.split(',')[1];
      const text = await callClaude([{
        role:'user',
        content:[
          { type:'image', source:{ type:'base64', media_type: mediaType, data: base64 } },
          { type:'text', text: `Solve or explain this school question step by step in simple language for a ${GRADE_LABELS[state.user.grade]} student. ${state.solverContext ? 'Context: ' + state.solverContext : ''}` }
        ]
      }], { system: 'You are a kind, patient personal tutor for Indian school students across all subjects. Explain clearly with short steps.' });
      state.solverAnswer = text || 'Could not read an answer from the image — try a clearer photo.';
    }catch(err){ state.solverError = 'Could not reach the tutor engine. Please check your connection and try again.'; }
    state.solverLoading = false; render();
  };

  const tutorSend = document.getElementById('tutorSend');
  const tutorInput = document.getElementById('tutorInput');
  async function sendTutorMsg(){
    const val = tutorInput.value.trim();
    if(!val || state.tutorLoading) return;
    state.tutorMessages.push({ role:'user', text: val });
    tutorInput.value=''; state.tutorLoading = true; render();
    try{
      const history = state.tutorMessages.map(m=>({ role: m.role==='user'?'user':'assistant', content: m.text }));
      const text = await callClaude(history, { system: `You are a warm, patient personal tutor for a ${GRADE_LABELS[state.user.grade]} Indian student, able to explain any subject simply, with short paragraphs and everyday examples.` });
      state.tutorMessages.push({ role:'assistant', text: text || "I couldn't quite work that out — try rephrasing?" });
    }catch(err){ state.tutorMessages.push({ role:'assistant', text: 'I could not reach the tutor engine. Please check your connection and try again.' }); }
    state.tutorLoading = false; render();
    const scroll = document.getElementById('chatScroll');
    if(scroll) scroll.scrollTop = scroll.scrollHeight;
  }
  if(tutorSend) tutorSend.onclick = sendTutorMsg;
  if(tutorInput) tutorInput.onkeydown = (e) => { if(e.key==='Enter') sendTutorMsg(); };

  document.querySelectorAll('[data-report-msg]').forEach(b=>b.onclick=()=>{
    const i = b.dataset.reportMsg;
    const msg = state.tutorMessages[i];
    window.location.href = `mailto:support@sumangyan.app?subject=Reported%20tutor%20answer&body=${encodeURIComponent('I want to report this AI answer:\n\n' + (msg ? msg.text : ''))}`;
  });
}

/* =========================================================
   Real connectivity + offline app-shell (service worker)
   ========================================================= */
// Reflect actual device connectivity, in addition to the manual "study offline" switch.
window.addEventListener('offline', () => { state.offline = true; render(); });
window.addEventListener('online', () => { /* leave manual toggle as-is; user can flip it back on */ });
if(!navigator.onLine) state.offline = true;

// Registering this makes the app-shell installable and load offline once visited once —
// required groundwork for Android TWA / PWA packaging. See service-worker.js in the store-ready package.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* not fatal inside a sandboxed preview */ });
  });
}

/* =========================================================
   Boot
   ========================================================= */
render();
setTimeout(() => { state.screen = 'auth'; render(); }, 1600);
</script>
